name: Backend quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sole_test
          MYSQL_USER: sole
          MYSQL_PASSWORD: sole_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, mysql, pdo, pdo_mysql, xml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Verify code style
        run: vendor/bin/pint --test

      - name: Verify migrations on MySQL
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_PROTOTYPE_MODE: 'false'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sole_test
          DB_USERNAME: sole
          DB_PASSWORD: sole_test_password
        run: php artisan migrate:fresh --force

      - name: Run regression tests
        run: php artisan test

      - name: Verify production configuration cache
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_PROTOTYPE_MODE: 'false'
        run: php artisan config:cache
