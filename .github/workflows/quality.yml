name: Backend quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sole_test
          MYSQL_USER: sole
          MYSQL_PASSWORD: sole_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, mysql, pdo, pdo_mysql, pcntl, xml, xmlreader, xmlwriter, zip
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Verify code style
        run: vendor/bin/pint --test
      - name: Static PHP syntax analysis
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: P12 production readiness static contracts
        run: bash scripts/production/audit-p12-contracts.sh
      - name: P13 admin operations static contracts
        run: bash scripts/production/audit-p13-admin-operations.sh
      - name: Verify migrations and RBAC on MySQL
        env: &mysql-test-env
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_PROTOTYPE_MODE: 'false'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sole_test
          DB_USERNAME: sole
          DB_PASSWORD: sole_test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate:fresh --force
          php artisan sole:rbac:sync
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
      - name: Run fast regression suite on SQLite
        run: php artisan test
      - name: Run full integration suite on MySQL
        env: *mysql-test-env
        run: php artisan test
      - name: Verify real MySQL inventory concurrency
        env: *mysql-test-env
        run: php tests/Support/inventory-concurrency.php
      - name: Verify real MySQL loyalty redemption concurrency
        env: *mysql-test-env
        run: php tests/Support/loyalty-concurrency.php
      - name: Verify routes and operator surface boot
        run: |
          php artisan route:list --except-vendor
          php artisan list sole
      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev
      - name: Verify production configuration cache and P12 invariants
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_PROTOTYPE_MODE: 'false'
          APP_URL: https://api.sole.example
          SOLE_PUBLIC_SITE_URL: https://sole.example
          SESSION_SECURE_COOKIE: 'true'
          SESSION_HTTP_ONLY: 'true'
          SESSION_SAME_SITE: lax
          QUEUE_CONNECTION: database
          DB_QUEUE_RETRY_AFTER: '90'
          QUEUE_FAILED_DRIVER: database-uuids
          CACHE_STORE: database
        run: |
          php artisan config:cache
          php artisan route:list --except-vendor
          php artisan sole:production:check --json
