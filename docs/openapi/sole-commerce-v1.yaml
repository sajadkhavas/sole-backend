openapi: 3.1.0
info:
  title: SOLE Commerce API
  version: 1.1.0
  description: Server-authoritative P06/P07 cart, checkout, payment verification, shipping, fulfillment, return and refund-request contract. Live provider credentials and monetary refund dispatch remain disabled until controlled production readiness.
paths:
  /api/v1/commerce/cart:
    get:
      summary: Resolve or create the active capability-scoped cart
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: Authoritative cart
          headers:
            X-Sole-Cart:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
  /api/v1/commerce/cart/items/{variant}:
    put:
      summary: Set authoritative variant quantity
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - name: variant
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200': { description: Updated cart }
        '409': { description: Variant, quantity or inventory conflict }
    delete:
      summary: Remove a variant from the cart
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - name: variant
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated cart }
  /api/v1/commerce/shipping/quotes:
    post:
      summary: Create server-authoritative shipping quotes for the active cart and owned address
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Eligible authoritative quotes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingQuote' }
        '409': { description: Cart/address/eligibility conflict }
  /api/v1/commerce/checkout:
    post:
      summary: Idempotently create an awaiting-payment order using an unexpired authoritative shipping quote
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, shipping_quote_id]
              properties:
                address_id: { type: integer, minimum: 1 }
                shipping_quote_id: { type: string, format: uuid }
      responses:
        '201':
          description: Original or replayed order result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '409': { description: Cart, quote, inventory or idempotency conflict }
        '503': { description: Authoritative checkout policy unavailable }
  /api/v1/commerce/orders:
    get:
      summary: List authenticated customer's orders with payment/shipment/return/refund state
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Customer-scoped order list }
  /api/v1/commerce/orders/{order}:
    get:
      summary: Get an authenticated customer's order
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Customer-scoped order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderEnvelope' }
        '404': { description: Missing or not owned by customer }
  /api/v1/commerce/orders/{order}/payments:
    post:
      summary: Idempotently initiate the configured payment gateway for an awaiting-payment order
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Payment attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
        '409': { description: Order/payment state or idempotency conflict }
        '503': { description: Payment provider disabled or not configured }
  /api/v1/commerce/payments/{payment}/verify:
    post:
      summary: Verify callback data server-to-server before marking an order paid
      security: [{ sanctum: [] }]
      parameters:
        - name: payment
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authority, status]
              properties:
                authority: { type: string, maxLength: 120 }
                status: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Verified or safely failed payment attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
        '409': { description: Ownership, authority, amount, currency or payment-state conflict }
  /api/v1/commerce/payments/{payment}/reconcile:
    post:
      summary: Reconcile a customer-owned payment attempt against provider truth
      security: [{ sanctum: [] }]
      parameters:
        - name: payment
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reconciled payment attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentEnvelope' }
        '409': { description: Reconciliation conflict }
  /api/v1/commerce/orders/{order}/returns:
    post:
      summary: Request a return for a customer-owned delivered order
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 80 }
                reason_text: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '201':
          description: Durable return request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnEnvelope' }
        '409': { description: Order not delivered or return request invalid }
  /api/v1/commerce/orders/{order}/refunds:
    post:
      summary: Idempotently request the remaining refundable amount; client does not choose the amount
      security: [{ sanctum: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Durable refund request; provider monetary execution is a separately controlled operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundEnvelope' }
        '409': { description: No verified payment/refundable balance or request conflict }
  /api/v1/commerce/shipping/provider-events:
    post:
      summary: Signed first-party shipping provider event boundary
      parameters:
        - name: X-Sole-Signature
          in: header
          required: true
          description: Lowercase hex HMAC-SHA256 of the exact raw request body using the configured webhook secret.
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_id, event_id, status, reason]
              properties:
                shipment_id: { type: string, format: uuid }
                event_id: { type: string, maxLength: 120 }
                status: { type: string, enum: [ready, shipped, delivered, exception, cancelled] }
                reason: { type: string, maxLength: 160 }
                tracking_number: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200': { description: Event applied or idempotently replayed }
        '401': { description: Invalid signature }
        '409': { description: Provider or transition conflict }
        '503': { description: Shipping webhook not configured }
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: sole_session
  parameters:
    CartToken:
      name: X-Sole-Cart
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: order
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CartEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, items, summary]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [active] }
            items: { type: array, items: { type: object } }
            summary: { type: object }
    ShippingQuote:
      type: object
      required: [id, provider, service_code, label, currency, amount_minor, expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        service_code: { type: string }
        label: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount_minor: { type: integer, minimum: 0 }
        eta_min_days: { type: [integer, 'null'], minimum: 0 }
        eta_max_days: { type: [integer, 'null'], minimum: 0 }
        expires_at: { type: string, format: date-time }
    PaymentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, order_id, provider, status, currency, amount_minor]
          properties:
            id: { type: string, format: uuid }
            order_id: { type: string, format: uuid }
            provider: { type: string, enum: [zarinpal, disabled] }
            status: { type: string, enum: [initiating, pending, paid, failed] }
            currency: { type: string, minLength: 3, maxLength: 3 }
            amount_minor: { type: integer, minimum: 0 }
            redirect_url: { type: [string, 'null'], format: uri }
            reference_id: { type: [string, 'null'] }
            verified_at: { type: [string, 'null'], format: date-time }
    ReturnEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, order_id, status, reason]
          properties:
            id: { type: string, format: uuid }
            order_id: { type: string, format: uuid }
            status: { type: string, enum: [requested, approved, received, rejected, closed] }
            reason: { type: string }
            reason_text: { type: [string, 'null'] }
    RefundEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, order_id, status, amount_minor, reason]
          properties:
            id: { type: string, format: uuid }
            order_id: { type: string, format: uuid }
            status: { type: string, enum: [requested, processing, manual_review, completed, failed] }
            amount_minor: { type: integer, minimum: 1 }
            reason: { type: string }
            provider_reference: { type: [string, 'null'] }
    OrderEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, currency, subtotal_minor, discount_minor, shipping_minor, total_minor, items]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [awaiting_payment, paid, processing, fulfilled, cancelled, expired] }
            currency: { type: string, minLength: 3, maxLength: 3 }
            subtotal_minor: { type: integer, minimum: 0 }
            discount_minor: { type: integer, minimum: 0 }
            shipping_minor: { type: integer, minimum: 0 }
            shipping_provider: { type: [string, 'null'] }
            shipping_service_code: { type: [string, 'null'] }
            total_minor: { type: integer, minimum: 0 }
            reservation_expires_at: { type: [string, 'null'], format: date-time }
            payment: { type: [object, 'null'] }
            shipment: { type: [object, 'null'] }
            return: { type: [object, 'null'] }
            refunds: { type: array, items: { type: object } }
            items: { type: array, items: { type: object } }
