openapi: 3.1.0
info:
  title: SOLE Storefront Catalog API
  version: 1.1.0
  description: >-
    Read-only P02 storefront contract. Product, price, availability and media truth are
    backend-authoritative. Public media sources are generated only from ready, server-verified
    assets and use content-addressed derivative paths suitable for immutable caching.
servers:
  - url: /api
paths:
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database-backed application readiness
  /v1/catalog/products:
    get:
      operationId: listCatalogProducts
      parameters:
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Published products that currently have at least one sellable variant
  /v1/catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published product with sellable variants and ready responsive media
        '404':
          description: Product is missing, unpublished or not sellable
components:
  schemas:
    CatalogTaxonomy:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
    MediaSource:
      type: object
      required: [recipe, url, width, height, format, sha256]
      properties:
        recipe:
          type: string
          description: Deterministic derivative recipe identifier.
        url:
          type: string
          format: uri-reference
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        format:
          type: string
          enum: [webp]
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    CatalogMedia:
      type: object
      required: [asset_uuid, role, sort_order, alt_text, sources]
      properties:
        asset_uuid:
          type: string
          format: uuid
        role:
          type: string
        sort_order:
          type: integer
          minimum: 0
        alt_text:
          type: [string, 'null']
          description: Required for non-decorative catalog attachments before publication.
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MediaSource'
    CatalogVariant:
      type: object
      required: [id, sku, title, price_minor, currency, available_quantity, media]
      properties:
        id:
          type: integer
        sku:
          type: string
        title:
          type: string
        size:
          type: [string, 'null']
        color:
          type: [string, 'null']
        price_minor:
          type: integer
          minimum: 0
        compare_at_price_minor:
          type: [integer, 'null']
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        available_quantity:
          type: integer
          minimum: 0
        media:
          type: array
          items:
            $ref: '#/components/schemas/CatalogMedia'
    CatalogProduct:
      type: object
      required: [id, slug, name, brand, tags, published_at, category, collections, media, variants]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        brand:
          type: [string, 'null']
        colorway:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        published_at:
          type: [string, 'null']
          format: date-time
        category:
          anyOf:
            - $ref: '#/components/schemas/CatalogTaxonomy'
            - type: 'null'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTaxonomy'
        media:
          type: array
          items:
            $ref: '#/components/schemas/CatalogMedia'
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogVariant'
