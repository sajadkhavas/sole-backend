openapi: 3.1.0
info:
  title: SOLE Storefront Catalog API
  version: 1.2.0
  description: >-
    P05 storefront discovery and PDP decision-support contract. Search, ranking, price,
    availability, media and related inventory are backend-authoritative. Unsupported social
    proof, delivery and return claims fail closed. Back-in-stock capture records consent only;
    notification delivery is deferred to P09.
servers:
  - url: /api
paths:
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Database-backed application readiness
  /v1/catalog/products:
    get:
      operationId: discoverCatalogProducts
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: brand, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: size, schema: { type: string } }
        - { in: query, name: availability, schema: { type: string, enum: [all, in_stock, out_of_stock] } }
        - { in: query, name: price_max_minor, schema: { type: integer, minimum: 0 } }
        - { in: query, name: quick, schema: { type: string, enum: [all, new, sale, limited] } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, merchandising, newest, price_asc, price_desc] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 48 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Published products with active variants plus authoritative facets and optional no-result recovery
  /v1/catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published product with active variants, per-variant availability and fail-closed decision support
        '404':
          description: Product is missing, unpublished or has no active variant
  /v1/catalog/products/{slug}/related:
    get:
      operationId: getRelatedCatalogProducts
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      responses:
        '200':
          description: Up to eight backend-ranked related published products
  /v1/catalog/products/{slug}/back-in-stock:
    post:
      operationId: registerBackInStockIntent
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, email, consent, consent_version]
              properties:
                variant_id: { type: integer, minimum: 1 }
                email: { type: string, format: email, maxLength: 254 }
                consent: { type: boolean, const: true }
                consent_version: { type: string, const: p05-v1 }
      responses:
        '201': { description: New consented intent registered; no notification sent }
        '200': { description: Existing intent refreshed idempotently }
        '409': { description: Variant is already available }
        '422': { description: Invalid input or consent missing }
components:
  schemas:
    CatalogTaxonomy:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
    MediaSource:
      type: object
      required: [recipe, url, width, height, format, sha256]
      properties:
        recipe: { type: string }
        url: { type: string, format: uri-reference }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        format: { type: string, enum: [webp] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    CatalogMedia:
      type: object
      required: [asset_uuid, role, sort_order, alt_text, sources]
      properties:
        asset_uuid: { type: string, format: uuid }
        role: { type: string }
        sort_order: { type: integer, minimum: 0 }
        alt_text: { type: [string, 'null'] }
        sources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/MediaSource' }
    CatalogVariant:
      type: object
      required: [id, sku, title, price_minor, currency, available_quantity, availability, media]
      properties:
        id: { type: integer }
        sku: { type: string }
        title: { type: string }
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        price_minor: { type: integer, minimum: 0 }
        compare_at_price_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        available_quantity: { type: integer, minimum: 0 }
        availability: { type: string, enum: [in_stock, out_of_stock] }
        media: { type: array, items: { $ref: '#/components/schemas/CatalogMedia' } }
    DecisionSupport:
      type: object
      required: [availability, pricing, comparison, social_proof, delivery, returns]
      properties:
        availability: { type: object }
        pricing: { type: object }
        comparison: { type: object }
        social_proof:
          type: object
          description: Remains unavailable until verified P08 review evidence exists.
        delivery:
          type: object
          description: Remains unverified until authoritative fulfillment data exists.
        returns:
          type: object
          description: Remains unverified until authoritative policy data exists.
    CatalogProduct:
      type: object
      required: [id, slug, name, brand, tags, published_at, merchandising_priority, category, collections, media, variants, decision_support]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        colorway: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        published_at: { type: [string, 'null'], format: date-time }
        merchandising_priority: { type: integer }
        category:
          anyOf:
            - { $ref: '#/components/schemas/CatalogTaxonomy' }
            - { type: 'null' }
        collections: { type: array, items: { $ref: '#/components/schemas/CatalogTaxonomy' } }
        media: { type: array, items: { $ref: '#/components/schemas/CatalogMedia' } }
        variants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CatalogVariant' } }
        decision_support: { $ref: '#/components/schemas/DecisionSupport' }
